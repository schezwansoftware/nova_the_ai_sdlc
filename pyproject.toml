[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc"
version = "0.1.0"
description = "Nova: AI-powered SDLC automation platform (CLI client + orchestration engine)."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
ai-sdlc = "ai_sdlc.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
